name: Daily investor profile

on:
  schedule:
    - cron: "0 15 * * 1-5"   # 15:00 UTC = 20:30 IST, Monday to Friday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install pandas openpyxl requests yfinance

      - name: Fetch data and build dashboard
        run: python run_all.py

      - name: Publish dashboard to GitHub Pages folder
        run: |
          mkdir -p docs
          cp output/dashboard.html docs/index.html
          git config user.name "investor-profiler-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No change to publish"
          else
            git commit -m "Daily update of investor profile"
            git push
          fi
